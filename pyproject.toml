[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-voice-pipeline"
version = "0.1.0"
description = "Universal low-latency conversational voice AI pipeline powered by Gemini Live WebSockets."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "sounddevice>=0.4.6",
    "numpy>=1.24.0",
    "websockets>=12.0",
]

[project.scripts]
voice-pipeline = "main:main"

[tool.setuptools.packages.find]
where = ["src"]
